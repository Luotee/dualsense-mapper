[package]
name = "dualsense-mapper"
version = "3.2.1"
edition = "2021"
rust-version = "1.88"
description = "Map gamepad buttons and analog inputs to keyboard and mouse."
license = "MIT"

[[bin]]
name = "PadToKBM"
path = "src/main.rs"

[lib]
name = "dualsense_mapper"
path = "src/lib.rs"

[dependencies]
# gilrs removed in v2.0.0 — DualSense BT raw HID via hidapi only.
# See docs/superpowers/specs/2026-05-17-v2.0.0-raw-hid-dualsense-design.md.
hidapi = "2.6"
crc32fast = "1"
enigo = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
tracing = "0.1"
# Local time for the event log file (already in the tree via Tauri).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
fastrand = "2"
anyhow = "1"
thiserror = "1"
crossbeam-channel = "0.5"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
# Switch 2 Pro BLE pairing crypto (gamepad/ns2_protocol.rs): AES-128-ECB + random A1/A2.
aes = "0.8"
rand = "0.8"
# sha256 of the pinned ViGEmBus installer (vigem_setup.rs); already in the tree via Tauri.
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-ico", "devtools"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_System_IO", "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_Input_XboxController", "Win32_System_Com_Urlmon", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell"] }
# Switch 2 Pro BLE worker (gamepad/ns2_ble.rs). btleplug 0.13.4 is the
# version proven on Win11 hardware; the worker runs its own current-thread
# tokio runtime on a dedicated std thread.
btleplug = "0.13.4"
tokio = { version = "1", features = ["rt", "time", "macros"] }
futures = "0.3"
# Virtual Xbox 360 pad for the Switch 2 Pro in no-mapping mode
# (xinput_sink.rs). User-mode client of an externally installed ViGEmBus.
vigem-client = "0.1"

[features]
default = []
gui = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-build"]
tray = []
hot_reload = []
test-utils = []

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
